name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emebel_test
      SESSION_SECRET: ci-session-secret-change-me
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emebel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - run: npm run db:seed
        env:
          SEED_DEMO_DATA: "true"
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
