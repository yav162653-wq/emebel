services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: emebel_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable-test-only
    ports:
      - "127.0.0.1:55437:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emebel_test"]
      interval: 2s
      timeout: 3s
      retries: 30
